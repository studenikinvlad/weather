[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "city-folder-pilot"
version = "0.4.0"
description = "City weather channels with subscription-gated temporary folder links"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "Pillow==12.3.0",
    "filelock==3.25.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.2",
    "Telethon==1.44.0",
    "tzdata==2026.4",
    "aiohttp-socks==0.12.0",
    "python-socks==3.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[tool.setuptools.packages.find]
include = ["city_folders*"]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
